# Drawing settings for run.py. Loaded by config.load().
# Colors: either a grayscale value in 0..1, or an [R, G, B] list
# (0..255 each); lists are encoded internally for pshelper.set_color.

experiment: 72

rgb_color: true
text_tag: true
draw_ftof: false
draw_pmt: true

global_rotation_angle: 0      # degree

scale_factor: 0.01
scale_with_tic: false
cm_to_point: 28.3
paper_width: 210.0            # mm
paper_height: 297.0           # mm

font: /TimesNewRomanPSMT
# font: /TimesNewRomanPS-BoldMT
# font: /TimesNewRomanPS-ItalicMT
# font: /ArialMT
# font: /Arial-BoldMT
# font: /Arial-ItaricMT
font_size: 1400               # multiplied by scale_factor on load

color_black: 0
color_white: 1
color_gray: 0.5
color_light_gray: 0.8
color_dark_green: [0, 100, 0]        # dipole magnets
color_maroon: [176, 48, 96]          # magnet coils
color_blue: [0, 0, 255]              # beam orbit
color_orange: [255, 140, 0]          # quadrupole magnets
color_light_cyan: [216, 242, 255]    # LH2
color_light_pink: [255, 182, 193]    # SHS
color_light_yellow: [255, 255, 224]  # HypTPC

line_width: 5
